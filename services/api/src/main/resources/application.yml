server:
  port: 8080

spring:
  application:
    name: taronote-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/taronote}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: filesystem:../infra/db/migrations,classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  jackson:
    deserialization:
      fail-on-unknown-properties: false

jwt:
  secret: ${JWT_SECRET:dev-secret}
  ttl-minutes: 720

agent:
  scheduler:
    batch-size: 32
    base-interval-seconds: 1800
    jitter-ratio: 0.2
    max-llm-concurrency: 32

taronote:
  adapter:
    mode: default
  logging:
    mode: slf4j
    otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
    otlp-protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:grpc}

logging:
  level:
    com.taronote: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
